
.Movement:
  .Weekly:
    Details: 
      - Movement Management - Weekly Analysis and Exercise Creation:
        Within HOS, Movement Management is divided into two main activities: Weekly Exercise Analysis and Exercise Creation.
      - The purpose:
        - Is to systematically evaluate physical performance, identify areas for improvement, and develop or adjust exercise routines based on individual progress, physical condition, and training goals.
        - Investigate how improvements in physical fitness influence cognitive performance,particularly mental calculation, concentration, working memory, and thinking quality.
    Result:
      1. Weekly Exercise Analysis:
        A total of 3 hours per week is allocated to reviewing and analyzing exercise performance:
          - Strength Training: 2 hours per week, preferably immediately after training sessions, to review exercise technique, muscular performance, stability, and areas requiring improvement.
          - Running: 30 minutes after each run, twice per week (1 hour total), to evaluate cardiovascular performance, running efficiency, heart rate, training intensity, recovery, and subjective observations.
      2. Exercise Creation:
        - Based on the weekly analysis, exercises are selected, modified, or developed to address identified weaknesses, improve physical performance, and support individual training goals.
        - This continuous cycle of Exercise → Observation → Analysis → Adjustment aims to optimize physical fitness while investigating its relationship with cognitive performance, including concentration, mental calculation, and thinking quality.
    ExpectedOutcome:
      - Develop an evidence-informed exercise routine that improves physical performance while supporting cognitive efficiency, mental clarity,and overall human functioning.















