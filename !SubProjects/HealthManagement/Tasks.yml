              Levels .Irritability:
              Levels .Drowsiness:
              Levels .Foggyness:
              string .TummyGassesFeel:
              Levels .Bloatedness:
              Levels .Burping:
              Levels .Farting:
              Levels .Headache:
              Levels .Hornyness:
              Levels .MusicEnjoyment:
            class .ExerciseLog:
