namespace Barba.Types:
  Summary:
    The Items we use for "business" purposes - e.g. Task, Requirement, etc. - on top of the "Standard" items you can find in -->System\Types\."namespace System.Types"<
  Comments:
    - [Bobi, 20251208, "The name 'Barba' signals that it should be renamed but I have no good idea. The term 'Barba' is a homage to the children cartoon 'BarbaPapa'"]

  class Task:
    Inherits: StandardItem
    Properties:
      TaskStatusEnum Status:
          Mandatory: true
      string Details:
      #- string <-Workspace-:
      string Estimation:
        Summary: 
          - the estimated time needed to complete the task, optionally the scenario description as well (so estimated when, by whom, for what case)          
      Duration RemTime:
        Summary:
          - the remaining time needed to complete the task, set by the one working on it
      string Result:
        Summary: the result of the task, e.g. if it's a question, then the answer.
      WorkLog[] WorkLog:
        Summary: 
        - a list of WorkLog entries; it is expected that the usual way of adding this entry is in a flow sequence of the values
        - Example:
            MyItem:
              WorkLog:
                - [bobi, 10m, "writing the above", 20250115T2015]
                - [bobi, 1m, "writing this line"]
      Task[] DependsOn:
        Summary: This task depends on another task, meaning this can't be finished (or even started) until the other is done
      Task[] Dependents:
        Summary: The other tasks which depend on this task, meaning those can't be finished (or even started) until this is done
      # Requirement[] Milestone:
      #   Summary: The milestone(s) it belongs to
      DateTime ScheduledAt:
        Summary: If a task is scheduled to be done at a certain date/time, the datetime.
        Notes: 
          - The task should be in the "Scheduled" state.
      Requirement ForRequirement:
        Summary: The Requirement for which this Task is needed      
      Task MaintenanceTasks:
        Summary: The Task which is about maintaining this Task-tree - estimating, creating/organizing subtasks, etc.
        Details: This can either contain the Task directly or link (f2link) to it
      Task[] SubTasks:
        Flags: [IsDefault]
        #"IsDefault" flag means that this is the default list the system would populate with Items specified with the "." notation, e.g. if there is a Task: 
        #
        #MyTask:
        #  SubTasks:
        #    Apple:
        #
        #Then it can be written this way:
        #
        #MyTask:
        #  .Apple:
        #
        #because the system would treat "Apple" as an element of the default array (SubTasks)      
      User[] By:
        Summary:
          a list of users who (can) perform/contribute to the task. The first user is the responsible one.
      TaskStatusEnum[] PreviousStatuses:
        Summary:
          a list of Statuses, containing the Status history of this Task.
        Notes:
          Temporary. Mostly for being able to know what was the status before a Task became "Blocked".
          Should be removed when the same can be accomplished using event log - for which first we need the event log and a full F2Tool based functionality.
      string Workspace:
        Summary:
          One can put any "work in progress" scribblings, notes, incomplete results here.
        Notes:
          Replacing the <-Workspace- "extension property" as at the moment these types of properties will be supported in much later phases only (if at all)
          
  class WorkLog:
    Properties:
      - User Performer:
          Mandatory: true
      - Duration Spent:
          Mandatory: true
      - string ActivityDescription:
      - DateTime Start:
    Notes:
      - It is expected that the usual format of entering this data is the values in a sequence format: 
          That is: [username, spentTime, optionalActivityDescription, optionalStartTime]
          Example: [bobi, 10m, "writing this", 20250115 T 2015]

  enum TaskStatusEnum:
    .DraftTODO:
        Details: the initial status.
    .TODO:
        Details: when the task description is done (i.e. it's written down what needs to be done so that the one doing it would understand without needing to ask questions)
    .EstTODO:
        Details: 
          - it's estimated how long it would take to finish the task
          - in larger tasks you should only start working on a task (ideally...) after it reached this status
    .InProgress:
        Details: the task is 
    .Done:
    .CurrentFocus:
      Details:
        There should be only 1 CurrentFocus "tree"; it's highlighted (if using CustomColoring) on the right hand side bar          
    .Blocked:
      Details:
        The Task is blocked by another Task
      Notes: If a Task is set to this status then there should be a "DependsOn:" property added as well, signaling what other task or circumstance is blocking the one in this status.
    .NEXT:
      Details:
        The Task should be performed only after all the previous Tasks are done (in the parent Task)
    .Scheduled:
      Details: the Task is scheduled to be performed at a certain time
      Notes: If a Task is set to this status, then there should be a "ScheduledAt:" property set for the task
    .OnGoing:
      Details: 
        - The task is going on for a long time, on-off. 
        - Example: a Task for preparing for the standup, which happens every day, with the same steps, so instead of creating a new Task for each, you create one in this status and log the hours to it every day.
    .OnHold:
        Details: No work should be done on the task until further notice.
    .Cancelled:
        Details: The task should not be done at all.
    .Paused:
        Details: The task is paused due to needing to concentrate on other Tasks
    .Closed:
        Details: The task is not only done, but the information described in it is not expected to be necessary in the future and therefore can be archived - e.g. it does not have a Result field OR the information there is not necessary for any future tasks 

  class Bug:
    Inherits: Task
    Properties:
      BugStatus Status:
      User QA:
      string Version:
      string Area:
        Summary:
          the functionality group of the app - like "login"
      Levels Severity:
      string ActualResult:
      string ExpectedResult:
      string Steps:      
        Summary:
          what steps the QA performed, what was the result and what is the expectation
      Retest[] Retest:
        User QA:
        string Version:
        string Details:
        string ActualResult:
        string ExpectedResult:
        string Steps:

  enum BugStatus:
    Members:
      New:
      Accepted:
      Rejected:      
      Fixing:
      Fixed:
      Retesting:
      RetestFail:
      RetestSuccess:
      Closed:
      OnHold:
  
  enum Levels:
    Members:
      0-Zero:
      1-VeryLow:
      2-Low:
      3-Average:
      4-High:
      5-VeryHigh:
      6-Extreme:
      7-OMG:

  enum BristolPoopika:
    .Type1:
      Details: Separate hard lumps like nuts
    .Type2: 
      Details: Sausage-Shaped but lumpy
    .Type3:
      Details: Like a sausage but crackon the surface
    .Type4:
      Details: Like sausage or snake, smooth and soft
    .Type5:
      Details: Soft Blobs with clear cut edges
    .Type6:
      Details: Fluffy pieces with Ragged edges, a mushy stool
    .Type7:
      Details: Watery no soild pieces
    
  class TestCase:
    Inherits: StandardItem
    Properties:
      Requirement Requirement:
      string Preconditions:
      string TestSteps:
      string ExpectedResult:

  class Requirement:
    Inherits: StandardItem
    Properties:
      string Details:
      Requirement[] Parts:
        IsDefault: true
      Requirement[] RequiresRequirement:
      RequirementStatusEnum Status:
      integer CurrentValue:
      Area ForArea:
      User[] By:
        Summary:
          a listof users who (can) perform/contribute to the task. The first user is the responsible one.
      Task[] Tasks:
        Summary:
          the task(s) implementing this requirement (i.e. when they are done, the requirement should be fulfilled (~done))
    ##Methods:
    ##- void DoSomething(): =>SomeFunction()
    Notes:
      Equivalent to (at the time of writing the below):
        ItemType:
          Type: ClassDescription
          Id: Requirement
          Properties:
          - new: 
              Id: Details
              Type: string              
          - new:
              Id: Parts
              IsList: True
              Type: Requirement                
          - new:
              Id: RequiresRequirement
              IsList: True
              Type: Requirement
          - new:
              Id: Status
              Type: RequirementStatusEnum
          - new:
              Id: CurrentValue
              Type: integer  

  class Milestone:
    Inherits: Requirement
    Properties:
      Task[] Tasks:
        Summary: Tasks need to be completed to complete a Milestone
        
  enum RequirementType:
    Members:
      Requirement:
        IsDefault: true
      MileStone:

  enum RequirementStatusEnum:
    Members:
      New: 
          Summary: Initial Status
      Drafting:
          Summary: In process of creating first draft
      Draft:
          Summary: First Draft, subjected to review/polishing
      Reviewed:
          Summary: 
            - After a review and fixes, ready for taskification, no more - major - changes expected
            - A task is created for taskification
      ReadyForDev:
          Details: 
            - Cost/Value calculations done so that it can be prioritized and scheduled: 
              - Taskified and tasks estimated
              - value estimated (how much work it would save per avg user or what other value it has)
      InDev:
          Details:
            - Development started            
      Implemented:
          Details: 
            - Feature development finished
      InQA:
          Details: 
            - Under testing
            - no feature development any more
      BugFixing:
          Details: 
            - Bugs are being fixed
            - Should not go back to INQA if testing is still on going but all bugs got fixed momentarily
      QAPassed:
          Summary: QA passed
      Done:
          Summary: All activites are - supposedly - done
      Closed:
          Summary: All activities are surely done; the Requirement can be archived.
    Comments:
      Bobi: >
        Equivalent to (at least at the time of writing):
          new Enumeration:
            Id: RequirementStatusEnum
            Members:
            - new: 
                Id: New
                Summary: Initial Status                
            - new:
                Id: Drafting
                Summary: In process of creating first draft
            - new:
                Id: Draft
                Summary: First Draft
            - new:
                Id: Reviewed
                Summary: After a review
            - new:
                Id: ReadyForDev
                Summary: Value estimated
            - new:
                Id: Developing
                Summary: When development starts
            - new:
                Id: ReadyForQA
                Summary: When development is done
            - new:
                Id: InQA
                Summary: Under testing
            - new:
                Id: BugFixing
                Summary:                 
            - new:
                Id: QAPassed
                Summary: QA passed
            - new:
                Id: Closed
                Summary: Everything is done around the feature.
    
  class Area:
    Summary: Describes an Area in which the project needs to progress - such as F2Tool capability level, number of members or resources, process development level
    Inherits: StandardItem
    Properties:
      string Details:
      Area[] SubAreas:
        IsDefault: true
      Milestone[] Milestones:

  class UseCase:
    Inherits: StandardItem
    Properties:
      UseCaseStatusEnum Status:
        Summary: Signaling the maturity of the UC
      User[] Actors:
        Summary: The actors performing the actions in the UC
      string Given:
        Summary: The conditions we expect to be true - like user is logged in, has rights, etc.
      string When:
        Summary: At what point/circumstance the UC is triggered
      UCFlows Flows:
        Summary: The "Then" part, or, what should happen in the main and any non-main flows
      UCFlow[] AlternateFlows:
        IsDefault: true

  enum UseCaseStatusEnum:
    Members:
      0-New:
      1-SomeProgress:
      2-HighLevel:
      3-Detailing:
      4-AlmostDone:
      5-Done:
      6-Reviewed:
      7-Mature:
      8-Gandalf:
        Summary:
          this is a magically good state, a UC made by a simple human should not be able to reach this

  class UCFlows:    
    Properties:
      UCFlow Main:
      UCFlow[] Alternate:
        IsDefault: true

  class UCFlow:
    Inherits: StandardItem
    Properties:
      UCStep[] Steps:
        Summary: The steps to be taken by the actor(s)

  class UCStep:
    Inherits: StandardItem
    Summary: The textual description of a step in a flow of an UseCase
    Properties:
      UCStep[] Steps:
        IsDefault: true   

  class StandupReport:
    Inherits: StandardItem
    Properties:
      StandupWasEntry[] Was:
        Details: what happened since the last standup
      StandupNextEntry[] Next:      
        Details: what is the plan until the next standup
      string[] AOIB:
        Details: any other important business worth mentioning - like "I won't be available in the afternoon", "I need a discussion about something"

  class StandupWasEntry:
    Inherits: Item
    Properties:
      F2Link Link:
        Details: a link to the Task worked on
      string Note:
        Details: any notes about what happened with the task - e.g. "took longer time because encountered a time consuming issue"
      Duration Spent:
        Details: how much time was spent on it
      TimeStamp StartedAt: 
        Details: when was the task started
    Notes:
      - The following format is the recommended one:
          Format:
            Link: [Spent, Note, StartedAt]
          Example:
            -->Tasks\Management\..Administration<: [42m, "Cleanups", 20260422 T 1304]
  
  class StandupNextEntry:
    Inherits: Item
    Properties:
      F2Link Link:
        Details: a link to the Task worked on
      string Note:
        Details: any notes about what is expected to be done on the task - e.g. "plan and start it"
      Duration ExpectedDuration:
        Details: how much time is expected to be spent on it
    Notes:
      - The following format is the recommended one:
          Format:
            Link: [Spent, Note]
          Example:
            -->Tasks\Management\..Administration<: [30m, "plan and start it"]

  class StandupMeetingMinutes:    
    Inherits: StandardItem
    Properties:
      User ScrumMaster:
      User[] Participants:
      string ScrumMasterQuestions:      
      DateTime NextStandupPlannedAt:
      User NextStandupScrumMaster:

  class Article:
    Inherits: StandardItem
    Properties:
      string Title:
      string Details:
      string Content:
      Article[] Parts:
        IsDefault: true
      ArticleMaturity Maturity:

  class Notes:
    Inherits: Article
  
  enum ArticleMaturity:
    Members:
    .0-New:
    .1-SomeProgress:
    .2-HighLevel:
    .3-Detailing:
    .4-AlmostDone:
    .5-Done:
    .6-Reviewed:
    .7-Mature:
    .8-Gandalf:

  class ProcessDescription:
    Inherits: StandardItem
    Properties:
      string[] Actors:
      string[] PreRequisites:
      ProcessStep[] Steps:
        IsDefault: true

  class ProcessStep:
    Inherits: StandardItem
    Properties:
      string Actor:
        Summary: one of the actors
      string Details:
        Summary: the detailed description of what needs to be done
      ProcessStep[] SubSteps:
        IsDefault: true

