          Process:
            Steps:
              - During the (previous) day:
                - record and tag tasks according to the above guideline in "Tags" into locations the report is working from (e.g. TaskToBeSorted)
              - Before RePlSt:
                - go through the report results and update the Tasks with any changes
                - pick the ones which you're expecting to work on and fill in your standup report
                - Pm to:
