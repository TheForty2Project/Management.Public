    InProgress .Collect initial ideas:
      +: {CreatedBy: Bobi, CreatedAt: 20260609 T 143822, By: [Bobi, Hana], Estimation: 15m, Remaining: 15}
      Workspace:
        What we want with all this data collection:
          Final goals:
            Better mood and general physical condition so that we can be jolly happy all the time
          SubGoals:
            - Develop a knowledge-base about how to live the most happy life, understanding that health plays a big role:
              - a balance need to be found, because both:
                - health plays a big role in one's ability to be happy
                - one can't spend all his/her time on health-improvement taks; all work no play makes Jack a dull boy.
              - what and how to eat, exercise, take ds to find the balance
              - identify the areas which matter (eating timing, spices, macro-micro nutrients, exercise heavyness, frequency, timing, etc.)
              - identify what events cause what events - e.g. late eating causes bad mood and digestion next day
            - Create reports:
              - Detailed "completed exercises" reports, e.g. how many reps in what exercises (like bench-press)
          The followings should be logged:
            - an entry from one of the below LogEntry descendants
            - about each event the specific class is about
            - done:
                when: 1-2 times per day OR right after the event OR next morning/before bed
                how: do not spend too much time on it - so 20 mins ideally per day in total for 2 people
            - snippets should be created
          Classes:
            class .LogEntry:
              Inherits: StandardItem
              DateTime Time:
                Details: the time of the event; 
              string NotableThings:
                Details: anything notable for the event
            
            class .SupplementLog:
              Inherits: LogEntry
              string[] What:

            class .MealLog:
              Inherits: LogEntry
              string .Description:
              Levels .HungerBefore:
              Levels .HungerAfter:
              Levels .Amount:
              GarminAnalysis .GarminPhotoAnalysis:
                Details: type to be defined later
            class .PoopikaLog:
              Inherits: LogEntry
              PoopikaType .PType:

            class .GarminAnalysis:
              Inherits: Item
              string .URL:

            class .MoodLog:
              Inherits: LogEntry
              Duration .PeriodLengthInHrs:
                Details:
                  The length of time (starting from Time) for which the log is recorded; average values.
              Levels .Irritability:
              Levels .Drowsiness:
              Levels .Foggyness:
              string .TummyGassesFeel:
              Levels .Bloatedness:
              Levels .Burping:
              Levels .Farting:
              Levels .Headache:
              Levels .Hornyness:
            
            class .ExerciseLog:
              Inherits: LogEntry
              string .Kind:
                Details:
                  Weights, Running, Walking, Hiking, Stretching, Sauna
              Duration .Length:
              Levels .Intensity:

            class .DLog:
              Inherits: LogEntry
              string Kind:
                Details:
                  W, M, K, C, V, etc.
              Levels Intensity:
                Details:
                  The effects of it - how much it was felt                
              
