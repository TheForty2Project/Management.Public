                    - spent hours on non-dev and dev tasks
                    - scope creep for milestones - if there are milestones
                    - work hours from-to per person
                  - evaluate the performance of the team, have some recommendations about improving - or give some chocolate if everything is awesome
              - RePlSt:
                  - normal standup
                  - based on the reports, how were we doing, do we need to improve? If so:
                    - improve the processes (or, create Tasks for it)
              - update the site with the changes
