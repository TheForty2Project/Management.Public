.CurrentTasksMinimal:
  Type: QueryDescription
  Select: [EMPTY as *, Estimation, Status, By, RemTime, IDLINK as IdLink, DependsOn]
  From: [-->Tasks\<]
  OutputFile: CurrentWork\Bobi\CurrentTasks.csv

.TasksToBeSorted20260702:
  Type: QueryDescription
  Select: [EMPTY as *, Estimation, Status, By, RemTime, IDLINK as IdLink, DependsOn]
  From: [-->CurrentWork\Bobi\TasksToBeSorted\..TasksToBeSorted20260702<, -->CurrentWork\Bobi\TasksToBeSorted\..TESTING_DILITDIS<]
  OutputFile: CurrentWork\Bobi\TasksToBeSorted20260702.csv
  Where: 
    TaggedBy: []
    ItemTypes: [Bug]
    SkipUnder: [-->Tasks\Archive\<]


.CurrentTasks:
  Id: CurrentTasks
  Summary: Current Tasks  
  Type: QueryDescription
  Select: [EMPTY as *, Estimation, Status, By, RemTime, IDLINK as IdLink, DependsOn]
  From: [-->Tasks\<, -->CurrentWork\Bobi\TasksToBeSorted<]
  Where: 
    TaggedBy: [CSVTODO]
    ItemTypes: [Task, Bug]
    SkipUnder: [-->Tasks\Archive\<]
  OutputFile: Reports\CurrentTasks.csv
  BehaviorWhenDeletingRows: RowDeletingBehavior..CommentOut
  AddSyncResultColumn: true

.CurrentTasks_Sandbox:
  Id: CurrentTasks
  Summary: Current Tasks
  Type: QueryDescription
  Select: [EMPTY as *, Estimation, Status, By, RemTime, IDLINK as IdLink, DependsOn]
  Items:      
    - Root: -->Tasks\<
      Where: 
        TaggedBy: [CSVTODO]
        ItemTypes: [Task, Bug]
        SkipUnder: [-->Tasks\Archive\<]
        MatchExpression: 
          contains(item.Tags, "CSVTODO") 
          & Type == Task
          & Status > TODO 
          & IsSomeSpecialConditionTrue(item)
    - Root: -->CurrentWork\Bobi\TasksToBeSorted]   
  OutputFile: Reports\CurrentTasks.csv
  BehaviorWhenDeletingRows: RowDeletingBehavior..CommentOut
  AddSyncResultColumn: true



