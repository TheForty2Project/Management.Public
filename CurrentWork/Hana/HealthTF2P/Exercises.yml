          - Hip & Pelvic Alignment:
            - Glute bridges / hip thrusts → strengthen glutes, counteracting sitting.
            - Hip flexor stretches → release tight hips.
            - Clamshells → activate glute medius for pelvic stability.
          - Spinal Mobility:
            - Catcow stretch → mobilizes spine.
