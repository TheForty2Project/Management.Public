    Morning Activities:
    - First body movemets after waking up:
      - Stretch        
      - Breathing:
        - Deep Diaphragmatic Breathing:
          - Reason:
            - Stimulates lymph flow in the chest and abdomen
            - Activates the parasympathetic nervous system
            - Oxygenates the body after shallow sleep breathing
      - Movement:
      - Joint Manipulation:
        - Spinal Mobility (Cat-Cow or Pelvic Tilts):
          - Reason:
            - Helps wake the spine, back muscles, and nervous system
            - Encourages flow of lymph along the thoracic area
          - Options:
            - On hands/knees: cat-cow
            - In bed: gentle pelvic tilts and spinal rolling
        - Neck + Jaw Mobility:
          - Reasons:
            - Lymph nodes around the neck drain the face, head, and upper body.
          - Options: 
            - Slow head circles
            - Jaw release (open/close and side-to-side movement)
            - Ear-to-shoulder stretches
        - Ankle, Wrist and Shoulder rolls:
          - Reasons:
            - After being still all night, joints can be stiff and circulation low.
          - Options:
            - Stand and gently bounce on your heels or balls of feet
            - Or use a mini trampoline (if available)
            - Just 1-2 minutes is effective.
        - Dry Brushing (if you want a lymph boost):
          - Reasons:
            - Stimulates lymph vessels under the skin
            - Before showering is ideal
          - Options:
            - Brush toward the heart starting from:
              - Feet → legs
              - Hands → arms
              - Abdomen → chest
        - Hydration + Movement:
          - Reason:
            - Hydration makes lymph fluid less viscous, helping it drain better.
          - Add:
            - A squeeze of lemon
            - and/or a pinch of sea salt (for electrolytes)
