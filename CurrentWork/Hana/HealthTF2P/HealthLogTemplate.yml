Details of Classes of Health Log (Properties we can choose from and it's description):
  +: { CreatedBy: Bobi, CreatedAt: 20260727 T 154650, By: [ Hana ], Tags: [ TL, Private, Health ], Estimation: 30, RemTime: 30, Importance: 5-VeryHigh }
  Details:
    - what can you use it for - collect use cases ("I want to have answer to question x so I go and check this and that")
    - how can you improve it - how to do it quicker, what data to use instead of what, queries, scripts, etc.
  Workspace:
    Intro:
      The HealthLog combines the two major principles of our HOS:
        - Timeline first: Recording what happened, when it happened, and the state of that moment.
        - State transitions (Later phase): Observation whether an event or intervention was followed by a change in our physical or cognitive state.  
    Details: 
        HumanOperatingSystem:
          Principle:
            PrimaryStructure: Timeline
            Description: 
              Record human experiences chronologically.
              Each entry represents an event, state, decision,
              or intervention at a particular time.

              Categories are properties of timeline entries,
              not separate storage structures.

            CoreModel: 
              StateBefore -> Event -> StateAfter -> StateTransition

            Goal: 
              Understand how events influence physical,
              cognitive, and emotional states over time.
              Identify patterns, test hypotheses, and improve decisions.
          Timeline:

            Organization:
              - Morning
              - Afternoon
              - Evening

          Notes:  
            You can find the classes here -->BusinessClasses\..HealthLogClasses<
          Analysis (Next Phase):

            StateTransitions:
              Description: 
                Compare states before and after events.
                Temporal association does not establish causation.

            Patterns:
              Description: 
                Identify repeated relationships across timeline entries.

            Hypotheses:
              Description: 
                Generate testable explanations for observed patterns.

            Experiments:
              Description: 
                Test hypotheses using repeated measurements
                and controlled comparisons where possible.

            Predictions:
              Description: 
                Estimate likely future states or outcomes
                based on accumulated evidence.

            PersonalKnowledge:
              Description: 
                Store conclusions supported by repeated observations
                and experiments, including their uncertainty.

            DecisionEngine:
              Description: 
                Use current state, desired state, predictions,
                and personal knowledge to select useful actions.
          LearningLoop:
            - Timeline
            - StateTransitions
            - Patterns
            - Hypotheses
            - Experiments
            - Predictions
            - PersonalKnowledge
            - DecisionEngine
            - Action
            - Timeline

