  Timeline :
    - Notes:
      - The Timeline is the primary data structure of the Human Operating System. Instead of storing information first in separate categories such as Exercise, Nutrition, Brain, Sleep, and Digestion, HOS records life chronologically as it happens.Each timeline entry can represent an Event, State, Intervention, Decision, or Outcome, with categories such as Brain, Body, Movement, Nutrition, Sleep, Environment, and Social Context used as properties/tags. 
      - The core model is:
        - State A → Event/Intervention → State B = State Transition
        - This allows HOS to learn how particular experiences or actions change the human state over time.
      - Raw observations remain separate from interpretations:
        - Timeline → State Transitions → Patterns → Hypotheses → Experiments → Predictions → Personal Knowledge → Decision Engine → Action → Timeline
        - The ultimate purpose is not merely to record what happened, but to learn:
          - eg. Given my current state and desired state, which action is most likely to produce the desired transition based on my previous data?
          - This turns HOS from a health/activity tracker into an adaptive system for observing, understanding, predicting, and intentionally influencing human state transitions.
          - Architecture: https://docs.google.com/document/d/17veWvUx3WvytzMkpkYPBcO-YnvtZYeZhonBG2F_0W2A/edit?usp=sharing

