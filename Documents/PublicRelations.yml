  .Poll about Sacrifice:
    Id: PollAboutSacrifice
    Details:
      My (after ChatGPT hints) version:

        If one person (out of 7 billion) does x until an unknown deadline, it's heaven for all. 
        If no one - hell.
        
        Doing x needs huge sacrifice and you might not even get recognition, people might just say afterwards that "we would've reached heaven anyway - you think you're Jesus or what...".
        
        Would you do it if apparently no one is?
      Tags:
        Future, Logic, Human Nature        
      Title:
        Would you?
      Poll options:        
        Would. (I'd also get heaven and who cares about the opinion of people...)
        I'd first try to persuade everyone - but then do it in the end, hoping that others get at least less heaven.
        1 out of 7 billion... some idiot would surely do it.
        Heaven is a myth. The world is a toilet bowl.
