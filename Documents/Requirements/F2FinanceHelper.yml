Drafting .F2FinanceHelper:
  Summary: |
    A(n at first) console app which provides a way to have high trust in the handling of blockchain-based financial transactions in groups even if individual group members are not trusted, using a mathemathical method which requires that at least X number of people provide a cryptographical approval for a transaction to happen.    

    Core idea is that instead of certain people (e.g. finance boss) create crypto addresses, have access to the private key and do the transaction, the app would both create the address and handle the transactions but instead of storing the private key it would distribute cryptographic information about it to the members in a way that X (out of Y total) of these information pieces is enough to reconstruct the key. When there's a need for a transaction, these members are asked by the app to approve by providing their piece and the app itself would do the transaction once enough pieces have arrived.

    On top of the above, the transaction handling could also be set up in a way that certain approvers must approve - i.e. the information can't be reconstructed without their pieces (but - of course - their pieces alone are also not enough to initiate the transaction).
