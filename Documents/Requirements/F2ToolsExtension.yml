  Details:
    One can issue commands about creating and synching to/from reports based on a query description stored in a QueryDescription Item
  Tasks: -->Tasks\Software\F2ToolsExtension\..Tasks..QueryBasedCSV<
  MaintenanceTasks:
    - -->Tasks\Miscellaneous\..BA..F2Tools..QueryBasedCSV<    
  Artifacts:
    enum .SyncResultValues:
      .NoChange:
      .RowCreated:
      .RowUpdated:
      .RowDeleted:
      .ItemCreated:
      .ItemUpdated:
      .ItemNotFound:
    string[] .SelectPropertySpecialValues:
      - EMPTY #an empty value
      - SYNCRESULT #one of the values from SyncResultValues representing whether the row was created, updated, etc.
      - IDLINK #the Id based F2Link pointing to the Item
      - SUMMARYLINK #the Summary based F2Link pointing to the Item
    class .QueryDescription:
      Inherits: StandardItem
      Details:
        such as:
          CurrentTasks:
            Type: QueryDescription
            Id: CurrentTasks
            Summary: Current Tasks
            Select: [EMPTY as *, Estimation, Status, By, RemTime, IDLINK as IdLink, DependsOn]
            From: [-->Tasks\<]
            Where: 
              TaggedBy: [CSV]
              ItemType: [Task, Bug]
              SkipUnder: [-->Tasks\Archive\<]
            OutputFile: Reports\CurrentTasks.csv
            BehaviorWhenDeletingRows: RowDeletingBehavior..CommentOut
            AddSyncResultColumn: true
      Properties:
        string[] .Select:
          Mandatory: true
          Details: 
            - the Id-s of the properties to include in the report or keywords (instructing the generator to insert special values), and (optionally) the column name to use in the CSV, the two separated by the "as" keyword (and spaces in front-after)
            - special keywords: -->...SelectPropertySpecialValues<
            - same as the "SELECT" part of an SQL query
            - such as: [EMPTY as *, Estimation, Status, By, RemTime, IDLINK as IdLink, DependsOn, EMPTY as Notes]
            - Special keywords
        string[] .From:
          Mandatory: true
          Details:
            - Use the files under the specified path (file or Item); recursive.                
            - such as: [-->Tasks\<, -->Tasks\Software\F2ToolsExtension\< ]
        WherePartOfQuery .Where:
        IdString[] .OrderBy:
          Details:
            - list of the column ids of the columns by which the rows should be ordered + optional "asc" or "desc" keywords, comma separated
            - bnf: |
                -->Documents\F2YamlSpecification\BachusNaurForms.bnf\< 
            - if "desc" is present as a suffix, the order is descending
            - if all values:
              - can be parsed as numbers: sorts them as numbers; 
              - else if they can be parsed as durations: sorts them as durations
              - else sorts them as strings            
        RowDeletingBehavior .BehaviorWhenDeletingRows:
          DefaultValue: RowDeletingBehavior..CommentOut
          Summary: what to do if a row is deleted during a sync operation (i.e. when the query is re-run to sync the changes)
        bool .CreateNonExistingItems:
          DefaultValue: true
          Summary: if true, during write-back operation the Items which do not exist get created - i.e. if the link does not point anywhere, otherwise a 
          Details:
            - if the 
        bool .AddSyncResultColumn:
          DefaultValue: true
          Summary: adds a -->~..SelectPropertySpecialValues..SYNCRESULT< column when syncing (if it's not already present in the Select part)
        string .OutputFile:
          DefaultValue: the current path (where the file containing the QueryDescription is) + filename with extension ".csv" (or if exists, adds a not-existing number in a bracket)
          Details: 
            - the output file path (partial file system path, from the root of the workspace)
            - both the characters "\" and "/" are accepted as separators
            - such as: Reports\CurrentTasks.csv            
        # char CommentPrefix:
        #   Details: 
        #     - the prefix to use in front of comments
        #     - set to "#" by default (i.e. if this property is not present)
        # bool IncludeHeader:
        #   Details:
        #     - if set to true, the first line of the CSV will be a comment:
        #       - containing the link pointing to the Query description
        #       - and the generation time
        #     - set to true by default (i.e. if this property is not present)
    class .WherePartOfQuery:
      BelongsTo: QueryDescription
      Inherits: Item
      Properties:
        string[] .TaggedBy:
          DefaultValue: []
          Details: 
            - include only those Items which are tagged by one of the tags
            - such as: [CSV]
            - if empty, all Items
        string[] .ItemType: 
          DefaultValue: []
          Details: 
            - include only those Items which are one of the specified types
            - note that as of the time of writing (20260513), inheritance is not supported (so despite a Bug inherits Task, both need to be included)
            - such as: [Task, Bug]
            - if empty, all Items
        string[] .SkipUnder:
          DefaultValue: []
          Details:
            - skip those Items which are under the specified path (file or Item); recursive.
            - note that this takes precedence over From, i.e. the Items under these paths will be skipped even if their path is included in From
            - such as: [-->Tasks\Archive\<]
            - if empty, no Items skipped        
        bool .SkipFoldersAndFiles:
          DefaultValue: true
          Details:
            - skip Items which are represented as a folder or a file, or have the type "Folder"
        bool LeavesOnly:
          DefaltValue: false
          Details:
            - if true, includes only those Items which have no Children
        
    enum .RowDeletingBehavior:
      .Remove:
        Summary: the row is removed
      .CommentOut:
        Summary: the row is commented out
      .DoNothing:
        Summary: the row is kept as-is but marked as -->~..SyncResultValues..DeletedRow< if the -->~..SelectPropertySpecialValues..SYNCRESULT< column is present
    class .ReportHeader:
      Inherits: Item
      Properties:
        F2Link .QueryDescriptionLink:
        QueryDescription .QueryDescription:
        string[] .Log:
      Details:
        Template: |
          <ReportHeader>:
            +: {CreatedBy: USERNAME, CreatedAt: TIMESTAMP}
            QueryDescriptionLink: QUERYDESCRIPTION_LINK
            QueryDescription:
              QUERYDESCRIPTON
            Log:
              - [Created/Updated] at TIMESTAMP; Added/Updated/Deleted: NOOF_ADDED/NOOF_UPDATED/NOOF_DELETED
    .CommentPrefix: "#"      
    .NullValue: "" #so empty
    .EmptyValue: \"" #so two double quote characters
    .CSVHeader: >    
  Done .Registers commands:
    Id: RegistersCommands
    Tasks: -->Tasks\Software\F2ToolsExtension\..Tasks..QueryBasedCSV.."Registers commands"<
    Done .ExecuteQuery: 
      Command: "F2Tools.Reports.Execute: Execute query"
      Summary: if the cursor is on a Query, generates the CSV report according to it
      Details:
        if the file exists, overwrites the content BUT:
          - keeps any data already present in "EMPTY" columns 
          - IF (queryDescription.Select.Any(isF2Link)):
            - keeps the order of the rows            
            - comments out the rows for which there are no Items present (any more)            
    Done .WriteBack:
      Command: "F2Tools.Reports.WriteBack: Write back from output file"
      Summary: 
        if the cursor is on a Query (either in a yaml file or in the CSV file as comment) which contains F2Links in its Select part, writes the changes FROM the csv to the Items
      Details:
        if the property does not exist but there's data for it in the CSV cell, creates the property  
  InDev .Executes query:
    Id: ExecuteQuery
    Tasks: -->Tasks\Software\F2ToolsExtension\..Tasks..QueryBasedCSV..Execute<    
    Summary:
      Executes the query in the QueryDescription item under the cursor
    Details:
      When the user issues the $@-->...ExecuteQuery<@$ command, verifies and executes the query, then displays summary.
    InDev .Verifies query:  
      Tasks: -->Tasks\Software\F2ToolsExtension\..Tasks..QueryBasedCSV..Execute..Verify<      
      Details:                
        - IF (NOT: 
          - TryGetQueryDescriptionUnderTheCursor(out var queryDescriptionYaml) =:
              - Outputs the first Pair<Scalar, YamlMap> with a property "Type" set to "QueryDescription" amongst the Items enclosing the cursor position if walking through the parents of the enclosing Items.
              - Returns whether it found one or not
          ):
          - Display error message: The cursor must be on/inside of an explicitly defined QueryDescription Item (having the property "Type" set to the value "QueryDescription")
          - Stops 
        - ELSE IF (NOT:
          - VerifyQueryDescriptionAndDisplayError(queryDescriptionYaml) =:
            - Checks whether:            
              - Mandatory properties exist (Select, From)
              - The value of the Select property can be parsed
              - The value of the From property can be parsed and each link points to a valid location
          - displays error message detailing the problem, pointing to the property which is problematic and describing the problem                    
          - Stops
        - ELSE RETURN: queryDescription      
    ReadyForDev .Basic query execution:
      Id: BasicExecute
      ReqReq: -->Documents\Requirements\F2ToolsExtension\..QueryBasedCSV.."Executes query".."Verifies query"<
      Tasks: -->Tasks\Software\F2ToolsExtension\..Tasks..QueryBasedCSV..Execute..BasicExecute<      
      Details:
        - var queryDescription: result of $@-->.."Executes query".."Verifies query"<@$      
        - var items: 
            getItemsUnderTheLinksIn(queryDescription.From):            
        - generates the CSV from the items:
          - creates file header:
            - uses the prefix set in CommentPrefix in front of each header line
            - writes/updates the header generated by creating or updating a -->Documents\Requirements\F2ToolsExtension\..QueryBasedCSV.Artifacts.."ReportHeader"< Item complying with the template in its details
          - creates column headers:
            - uses the Ids or the string after the "as" keyword from the Select property; comma separated
          - creates lines from each Item:
            - gets the values of the  properties specified in the queryDescription.Select property by:
              - IF (NOT (the property is present)):
                - return a null value ($@-->Documents\Requirements\F2ToolsExtension\..QueryBasedCSV.Artifacts..NullValue<@$)
              - ELSE IF (the property is empty):
                - return an empty value ($@-->Documents\Requirements\F2ToolsExtension\..QueryBasedCSV.Artifacts..EmptyValue<@$)              
              - ELSE return the property value
            - escapes them
            - creates a string by concatenating them by using a comma (,) as separator              
        - writes the CSV into the output file:
          - either to the one specified in the queryDescription.OutputFile or if it's empty or not present, uses the current path (where the file containing the QueryDescription is) + filename with extension ".csv" (or if exists, adds a not-existing number in a bracket)
    ReadyForDev .Filters by the Where property:
      Id: Filter
      Tasks: -->Tasks\Software\F2ToolsExtension\..Tasks..QueryBasedCSV..Execute..Filter<
      ReadyForDev .TaggedBy:
        Details:
          - IF (values are present in the TaggedBy property):
              excludes the Items which are not tagged by any of the value                       
          - ELSE: do not exclude any
      ReadyForDev .ItemType:
        Details:
          - IF (values are present in the ItemType property):
            - include only those Items which are of these types
            - note that as of the time of writing (20260513), inheritance is not supported (so despite a Bug inherits Task, both need to be present as value)              
          - ELSE: do not exclude any
      ReadyForDev SkipUnder:
        Details:
          - IF (values are present in the SkipUnder property):
            - skip those Items which are under the specified path (file or Item); recursive.
            - note that this takes precedence over From, i.e. the Items under these paths will be skipped even if their path is included in From
          - ELSE: do not exclude any
    ReadyForDev .Displays summary after finished generating the CSV:      
      Id: ShowSummary
      Tasks: -->Tasks\Software\F2ToolsExtension\..Tasks..QueryBasedCSV..Execute..BasicExecute<
      Details:
        Displays the message: "Csv generated into OUTPUTFILE"
  ReadyForDev .Writes back from output:
    Id: WriteBack
    Tasks: -->Tasks\Software\F2ToolsExtension\..Tasks..QueryBasedCSV..WriteBack<
    ReqReq: -->Documents\Requirements\F2ToolsExtension\..QueryBasedCSV.."Executes query".."Verifies query"<
    Summary:
      writes the changes FROM the csv to the Items if the cursor is on a Query in the CSV file as comment, which query contains F2Links in its Select part
    Details:
      - Triggered by the -->...RegistersCommands..WriteBack< command.   
      - IF (NOT (the cursor is in a csv file)):
          displays error message: "The cursor must be in a CSV file on a QueryDescription Item"
      - gets the query yaml by parsing the header using the format described here: $@-->Documents\Requirements\F2ToolsExtension\..QueryBasedCSV.Artifacts.CSVHeader<@$
      - var queryDescription: result of $@-->Documents\Requirements\F2ToolsExtension\..QueryBasedCSV.."Executes query".."Verifies query"<@$
      - IF (NOT (queryDescription.Select.Any(isF2Link)):
          displays error message: "The Select property must contain F2Links (IDLINK or SUMMARYLINK)"
      - parses the csv into a headerId[columnNo] and csvCellsInLines[rowNo][columnNo] arrays
      - FOREACH (csvLine in csvCellsInLines):
        - finds the item using the f2link in the line
        - FOR (var columnNo=0; i<headerId.Length):
          - var cellValue = csvLine[columnNo]
          - IF (: 
            - cellValue != NullValue
            - AND cellvalue != one of the special field values ($@-->Documents\Requirements\F2ToolsExtension\..QueryBasedCSV.Artifacts.SelectPropertySpecialValues<@$)
            ):
              - IF (the property with the id headerId[columnNo] does not exist):
                - create it
              - set its value to csvLine[columnNo]
      - displays message "x out of total y Items updated"
