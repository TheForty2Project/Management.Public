    Details:      
      - on top of the "asc/desc" suffix, one can add a "byVal/asString" suffix as well
      - if "byVal" (default), then sorting is done on the values the cell values represent, e.g. if an enumeration member, then its defined numerical value:
        - like: 
            if we have:
              enum myEnum: { .Z: {Value: 1}, .X: {Value: 2}, .Y: {Value: 3}  }
            Then the order is:
              Z, X, Y (and not X, Y, Z)
      - if "asString", then sorting is done on the string representation, e.g. numbers sorted like "1, 11, 12, 2, 3..."
