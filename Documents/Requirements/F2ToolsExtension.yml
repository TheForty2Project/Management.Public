    Draft .Executes query:
      Summary:
        Executes the query in the QueryDescription item under the cursor
      Details:
        Verifies and executes the query, then displays summary when the user issues the ExecuteQuery command.    
      Draft .Verifies query:
        - IF (NOT(the Item under the cursor is a QueryDescription)):
          - Displays error message: "The cursor must be on an Item with type QueryDescription"
          - Stops.
        - ELSE IF (error during parsing of the Item):
          - Displays error message detailing the problem, pointing to the property which is problematic and describing the problem
          - Verifies the followings:
            - Mandatory properties exist (Select, From)
            - The value of the Select property can be parsed
            - The value of the From property can be parsed and each link points to a valid location
          - Stops.

      Draft .Executes basic query:
        ReqReq: -->Documents\Requirements\F2ToolsExtension\..Phase2..QueryBasedCSV.."Executes query".."Verifies query"<
        Details:
          - verifies the query as per -->Documents\Requirements\F2ToolsExtension\..Phase2..QueryBasedCSV.."Executes query".."Verifies query"<
          - gets the Items found under the f2links in the From property
          - generates the CSV from these Items:
            - creates file header:
              - uses the prefix set in CommentPrefix in front of each header line
              - writes the header generated by filling in the -->Documents\Requirements\F2ToolsExtension\..Phase2..QueryBasedCSV.Artifacts..CSVHeader< template
            - creates column headers:
              - uses the Ids or the string after the "as" keyword from the Select property; comma separated
            - creates lines from each Item:
              - gets the values of the properties specified in the Select property of the query by:
                - IF (NOT (the property is present)):
                  - return a null value ($@-->Documents\Requirements\F2ToolsExtension\..Phase2..QueryBasedCSV.Artifacts..NullValue<@$)
                - ELSE IF (the property is empty):
                  - return an empty value ($@-->Documents\Requirements\F2ToolsExtension\..Phase2..QueryBasedCSV.Artifacts..EmptyValue<@$)              
                - ELSE return the property value
              - escapes them
              - creates a string by concatenating them by using a comma (,) as separator
          - writes the CSV into the output file:
            - either to the one specified in the OutputFile or if it's empty or not present, uses the current path (where the file containing the QueryDescription is) + filename with extension ".csv" (or if exists, adds a not-existing number in a bracket)
      Draft .Filters by the Where property:
        Details:

        Draft .TaggedBy:
          Details:
            - IF (values are present in the TaggedBy property):
                excludes the Items which are not tagged by any of the value                       
            - ELSE: do not exclude any
        Draft .ItemType:
          Details:
            - IF (values are present in the ItemType property):
              - include only those Items which are of these types
              - note that as of the time of writing (20260513), inheritance is not supported (so despite a Bug inherits Task, both need to be present as value)              
            - ELSE: do not exclude any
        Draft SkipUnder:
          Details:
            - IF (values are present in the SkipUnder property):
              - skip those Items which are under the specified path (file or Item); recursive.
              - note that this takes precedence over From, i.e. the Items under these paths will be skipped even if their path is included in From
            - ELSE: do not exclude any
