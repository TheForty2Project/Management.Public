+: {Type: Folder, DefaultTypes: [QueryDescription, Folder]}

.TaskListTasks:
  Type: QueryDescription
  Summary: Current tasks - implemented (as a temporary measure) as Tasks tagged with "TL"
  Select: [Status, Importance, Estimation, By, RemTime, Summary, Tags, IDLINK as IdLink, DependsOn]
  From: 
    - -->CurrentWork\Bobi\<
    - -->CurrentWork\Hana\<
    - -->Tasks<
  OutputFile: Reports\TaskListTasks.csv
  OrderBy: [Importance desc, Status desc, By, RemTime]
  Where:     
    TaggedBy: [TL]
    LeavesOnly: false
    SkipFoldersAndFiles: false
    SkipUnder: [-->Tasks\Archive\<, -->CurrentWork\Bobi\TestMaterial\ReportGenTest\<]

.DevTasks:
  Type: QueryDescription
  Summary: Development tasks
  Select: [Status, Importance, Estimation, By, RemTime, Summary, Tags, IDLINK as IdLink, DependsOn]
  From: 
    - -->CurrentWork\Bobi\TasksToBeSorted<
    - -->CurrentWork\Hana\TasksToBeSorted<    
    - -->Tasks<
  OutputFile: Reports\DevTasks.csv
  OrderBy: [Status desc, Importance desc, By, RemTime]
  Where:     
    TaggedBy: [Dev]
    LeavesOnly: false
    SkipFoldersAndFiles: false

.Before1stPostTasks:
  Type: QueryDescription
  Summary: The tasks we need to complete before we show ourselves to the public
  Select: [Status, Importance, Estimation, By, RemTime, Summary, Tags, IDLINK as IdLink, DependsOn]
  From: 
    - -->CurrentWork\Bobi\<
    - -->CurrentWork\Hana\<
    - -->Tasks<
  OutputFile: Reports\Before1stPostTasks.csv
  OrderBy: [Importance desc, Status desc, By, RemTime]
  Where:     
    TaggedBy: [Before1stPost]
    LeavesOnly: false
    SkipFoldersAndFiles: false
    SkipUnder: [-->Tasks\Archive\<, -->CurrentWork\Bobi\TestMaterial\ReportGenTest\<]

.TaskListDoneTasks:
  Type: QueryDescription
  Summary: Tasks done
  Select: [Status, Importance, Estimation, By, RemTime, Summary, Tags, IDLINK as IdLink, DependsOn]
  From: 
    - -->CurrentWork\Bobi\<
    - -->CurrentWork\Hana\<
    - -->Tasks<
  OutputFile: Reports\Archive\TaskListDoneTasks.csv
  OrderBy: [Importance desc, Status desc, By, RemTime]
  Where:     
    TaggedBy: [TLDone]
    LeavesOnly: false
    SkipFoldersAndFiles: false
    SkipUnder: [-->CurrentWork\Bobi\TestMaterial\ReportGenTest\<]


