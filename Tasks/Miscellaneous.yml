      Done .Prepare for health-log showcase:
        +: { CreatedBy: Bobi, CreatedAt: 20260727 T 154650, By: [ Hana ], Tags: [ TL, Private, Health ], Estimation: 30, RemTime: 30, Importance: 5-VeryHigh }
        Details:
          - what can you use it for - collect use cases ("I want to have answer to question x so I go and check this and that")
          - how can you improve it - how to do it quicker, what data to use instead of what, queries, scripts, etc.
        Workspace:
          Intro:
            The HealthLog combines the two major principles of our HOS:
              - Timeline first: Recording what happened, when it happened, and the state of that moment.
              - State transitions (Later phase): Observation whether an event or intervention was followed by a change in our physical or cognitive state.  
          Details: 
              HumanOperatingSystem:
                Principle:
                  PrimaryStructure: Timeline
                  Description: 
                    Record human experiences chronologically.
                    Each entry represents an event, state, decision,
                    or intervention at a particular time.

                    Categories are properties of timeline entries,
                    not separate storage structures.

                  CoreModel: 
                    StateBefore -> Event -> StateAfter -> StateTransition

                  Goal: 
                    Understand how events influence physical,
                    cognitive, and emotional states over time.
                    Identify patterns, test hypotheses, and improve decisions.
                Timeline:

                  Organization:
                    - Morning
                    - Afternoon
                    - Evening

                  class .EventLogBase:
                    TimeStamp .Time:
                    string .Summary:
                    string .Notes:

                  class .SystemState:
                    Inherits: EventLogBase
                    Summary: 
                      Details:
                        A record of human's physical, emotional,
                        and cognitive condition at a specific moment.
                        Recommended at least three times daily (morning, afternoon, evening)
                      Example:  
                        <SystemState>:
                          Mood: 
                          ThinkingQuality:
                          Motivation:
                          PhysicalEnergy:
                          BodyBattery:
                          Rumination:
                    OneToTen .Mood:
                    OneToTen .ThinkingQuality:
                    OneToTen .Motivation:
                    OneToTen .PhysicalEnergy:
                    integer .BodyBattery:
                      Summary: Garmin estimate; 1-100
                    ZeroToFive .Rumination:


                  class .Sleep:
                    Inherits: EventLogBase
                    Summary: 
                      Records sleep quantity, quality, and recovery.
                      Usually recorded after waking.
                    TimeStamp .BedTime:
                    Duration .Duration:
                    OneToHundred .SleepScore:
                      Summary:
                        Garmin sleep score
                    TimeStamp .WakeTime:                        
                    OneToHundred .BodyBattery:
                      Summary:
                        Garmin body battery                      

                  class .Food:
                    Inherits: EventLogBase
                    Summary: 
                      Records food and drinks consumed.
                      Useful for studying energy, cognition,
                      digestion, and post-meal symptoms.

                    string .MealDescription:
                    OneToThree .Quantity:
                      Summary: |
                        1: Small, 2: medium, 3: large                      

                  class .Drugs:
                    Inherits: EventLogBase                  
                    Description: 
                      Records substances taken and their dosages.
                      Helps identify possible associations with
                      changes in physical or cognitive state.

                    Properties:
                      string .Name: 
                      string .Dosage: 
                      string .Unit:                       

                  class .Digestion:
                    Inherits: EventLogBase                  
                    Summary: 
                      Records bowel movements and digestive symptoms.
                      Useful for identifying patterns involving food,
                      movement, stress, and gastrointestinal function.

                    OneToSeven .Bristol: 
                    ZeroToFive .Bloating:
                    ZeroToFive .AbdominalPain:
                    ZeroToFive .Flatulence:
                    ZeroToFive .Belching:    

                  class .Movement:
                    Inherits: EventLogBase                  
                    Summary: 
                      Records physical activity, including:
                        Sports: walking, running, strength training, mobility
                        Physical work: cleaning, gardening, caryying heavy stuff                        

                    string .Activity:
                    Duration .Duration:
                    OneToThree .Intensity:
                      Summary: Easy / Moderate / Hard

                  class .Work:
                    Inherits: EventLogBase                  
                    Summary:
                      Records productive activities and cognitive demands.
                      Useful for connecting brain state with performance.

                    string .ActivityDesc:
                    Duration .Duration:
                    OneToFive .Focus:
                      Summary:
                        1: like a puppy / like someone who's being poked constantly
                        5: super interested, people can talk around me; the "flow state"
                    OneToFive .MindPower:
                      Summary:
                        how easy it is to solve a standard problem:
                          1: simple bureaucracy (e.g. paying bills) is problematic
                          5: give me the tough math problems

                  class .LifeEvent:
                    Inherits: EventLogBase                  
                    Summary: 
                      Details:
                        Records meaningful environmental, social,
                        or psychological experiences that may influence
                        the human state.
                      E.g.: fights, deep talks, SWAT team appearing downstairs

                    string .EventDescription: null
                    MinusFiveToFive .EmotionalImpact:
                      Summary:
                        -5: very negative; remembering it makes you cry/assume fetal position; e.g. the hiding in the mortuary case
                        -1: slightly negative; e.g. lashing out, then 5 minutes staying apart and then it's fine
                        1: slightly positive; e.g. good Serious Sam 3 session, good talk 
                        5: very positive; remembering it makes you smile for a long time
                    Notes: null

                  # class .Decision:
                  #   Summary: 
                  #     Details:
                  #       Records deliberate choices intended to achieve
                  #       a goal or change the current state.
                  #     e.g.:

                  #   Properties:
                  #     string .CurrentState:
                  #     string .DesiredState:
                  #     string[] .Options:
                  #     string .ChosenAction:
                  #     string .ExpectedOutcome:

                  # class .Intervention:
                  #   Summary: 
                  #     Details:
                  #       Records an intentional action taken to influence
                  #       a specific state or symptom.
                  #       Unlike a general event, it has an explicit purpose.
                  #     E.g.:

                  #   Properties:
                  #     Action: null
                  #     Target: null
                  #     Duration: null
                  #     ExpectedEffect: null
                  #     Notes: null

                  #   11_Outcome:
                  #     Description: 
                  #       Records the observed result of an action,
                  #       decision, or intervention.

                  #     Properties:
                  #       RelatedEventID: null
                  #       ObservedChange: null
                  #       DesiredOutcomeAchieved: null
                  #       Notes: null

                  class .PhysicalSymptoms:
                    Inherits: EventLogBase
                    Summary:
                      Records observable physical changes and symptoms.
                      Helps identify recurring patterns and possible
                      relationships with nutrition, digestion, menstrual
                      cycles, recovery, and laboratory results.

                      Physical observations are not sufficient to
                      diagnose anemia or other medical conditions.
                    SkinCondition .Skin: 
                    FaceCondintion .Face:
                    NailCondition .Nails:
                    AbdomenCondition .Abdomen:
                    GeneralCondition .General:                    

                  class .SkinCondition:
                    integer .Acne:
                      Summary: How many NEW ones appeared
                    OneToThree .Dryness:
                      Summary: One - good; Two - dry; Three - very dry
                    bool .Paleness:
                    bool .Rash:

                  class .FaceCondition:
                    OnetoThree .Puffiness: 
                      Summary: One - Normal; Two - Slight Puffy; Three - Very Puffy
                    string .Location: 
                      Summary:  Eyes / Cheeks / Whole face

                  class .NailCondition:
                    string .Color:
                    string .Ridges:
                    string .ShapeChange: 

                  class .AbdomenCondition:
                    OneToThree .Bloating: 
                      Summary: One - Normal; Two - Bloated; Three - Pregnant bloated
                    OneToFive .Pain:
                      Summary: One - No pain; Two - Slightly painful; Five - unbearable pain; 
                    string .Location: 

                  class .GeneralCondition:
                    OneToThree .Fatigue: 
                      Summary: One - Light Fatigue; Two - Medium Fatigue; Three - High Fatigue 
                    OneToThree .Dizziness:
                      Summary: One - Light Dizzness; Two - Medium Dizziness cant stand ; Three - High Dizziness with sense of vomiting 
                    OneToThree .ColdSensitivity:
                      Summary: One - Mild sensation of cold; Two - Moderate cold discomfort; Three - Sever cold sensation with shivering
                    string .Bruising:
                      Summary: the location if so
                    string .Swelling:
                      Summary: the location if so

                  class .MenstrualCycle:
                    Description: 
                      Records menstrual cycle timing, bleeding,
                      and associated physical and psychological symptoms.
                      Helps investigate individual relationships between
                      cycle changes, cognition, digestion, mood,
                      exercise performance, and recovery. This event type can be recorder every week

                    CycleInfo .Cycle:
                    BleedingInfo .Bleeding:                    
                    MenstruationSymptoms .Symptoms:
                  
                  class .CycleInfo:
                    integer .Day:               # Day 1 = first day of menstrual bleeding
                    MenstrualPhase .Phase:
                      Summary: Menstrual; Follicular; Ovulatory; Four - Luteal                      

                  class .BleedingInfo:
                    ZeroToFive .Flow: 
                      Summary: Zero - None; One - Spotting; Two - Light; Three - Moderate; Four - Heavy; Five - Worryingly much
                    string .Color:
                    bool .Clots: 

                  class .MenstruationSymptoms:
                    ZeroToThree .Cramps: 
                      Summary: Zero - no pain; One - some pain; Two - Uncomfortable pain; Three - Unbearable Pain
                    bool .BreastTenderness:                      
                    ZeroToThree .Bloating: 
                      Summary: Zero - none; One - might a little; Two - Bloated; Three - Pregnant bloated
                    ZeroToFive .Headache: 
                      Summary: Zero - none; One - Light, coming/going; Two - Medium Headache Uncomfortable; Three - Painful (hard to concentrate); Four - migraine (I can't do anything meaningful); Five - I'm gonna die
                    ZeroToThree .Fatigue: 
                      Summary: One - Light Fatigue; Two - Medium Fatigue; Three - High Fatigue 


                Analysis (Next Phase):

                  StateTransitions:
                    Description: 
                      Compare states before and after events.
                      Temporal association does not establish causation.

                  Patterns:
                    Description: 
                      Identify repeated relationships across timeline entries.

                  Hypotheses:
                    Description: 
                      Generate testable explanations for observed patterns.

                  Experiments:
                    Description: 
                      Test hypotheses using repeated measurements
                      and controlled comparisons where possible.

                  Predictions:
                    Description: 
                      Estimate likely future states or outcomes
                      based on accumulated evidence.

                  PersonalKnowledge:
                    Description: 
                      Store conclusions supported by repeated observations
                      and experiments, including their uncertainty.

                  DecisionEngine:
                    Description: 
                      Use current state, desired state, predictions,
                      and personal knowledge to select useful actions.
                LearningLoop:
                  - Timeline
                  - StateTransitions
                  - Patterns
                  - Hypotheses
                  - Experiments
                  - Predictions
                  - PersonalKnowledge
                  - DecisionEngine
                  - Action
                  - Timeline

